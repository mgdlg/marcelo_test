<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="planet" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0" stop-color="#e8aa4e"/>
      <stop offset="1" stop-color="#dd503f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#140d09"/>
  <g transform="rotate(-24 29 33)">
    <!-- far side of the orbit, behind the planet -->
    <ellipse cx="29" cy="33" rx="23" ry="8" fill="none" stroke="#efeae8" stroke-opacity="0.35" stroke-width="3"/>
  </g>
  <circle cx="29" cy="33" r="13" fill="url(#planet)"/>
  <circle cx="24" cy="27" r="3.5" fill="#fff" fill-opacity="0.22"/>
  <g transform="rotate(-24 29 33)">
    <!-- near side of the orbit, in front of the planet -->
    <path d="M6 33 A23 8 0 0 0 52 33" fill="none" stroke="#efeae8" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- satellite: body between two solar panels -->
  <g transform="translate(47.5 12.5) rotate(-35)">
    <rect x="-10.5" y="-2.5" width="7" height="5" rx="1" fill="#df9a53"/>
    <rect x="-2.5" y="-3.5" width="5" height="7" rx="1.5" fill="#efeae8"/>
    <rect x="3.5" y="-2.5" width="7" height="5" rx="1" fill="#df9a53"/>
  </g>
</svg>
