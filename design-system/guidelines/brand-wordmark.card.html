<!-- @dsCard group="Brand" viewport="700x240" name="Wordmark & monogram" subtitle="Syne name lockup with the gradient accent treatment" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 34px; display: flex; align-items: center; gap: 40px; }
  .lockup h1 { font-family: var(--font-display); font-weight: 700; font-size: 64px; line-height: 0.92; letter-spacing: -0.02em; margin: 0; }
  .soft { color: var(--ink); display: block; }
  .accent { display: block; background: linear-gradient(120deg, oklch(0.96 0.006 60) 0%, oklch(0.80 0.14 68) 45%, oklch(0.68 0.10 52) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .mono { font-family: var(--font-display); font-weight: 800; font-size: 80px; letter-spacing: 0.02em; color: var(--accent-warm); }
  .cap { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-faint); margin-top: 14px; display: block; }
</style>
</head>
<body>
  <div class="lockup">
    <h1><span class="soft">Marcelo</span><span class="accent">Guzmán</span></h1>
    <span class="cap">GIS · Environmental Intelligence</span>
  </div>
  <div style="text-align:center">
    <div class="mono">MGDLG</div>
    <span class="cap">Monogram · 26°N −100°W</span>
  </div>
</body>
</html>
