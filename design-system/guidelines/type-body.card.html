<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 30px 34px; }
  .lead { font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1.25; color: var(--ink); margin: 0 0 16px; max-width: 30ch; }
  p { font-family: var(--font-body); margin: 0 0 10px; max-width: 70ch; }
  .b300 { font-weight: 300; font-size: 19px; color: var(--ink-dim); }
  .b400 { font-weight: 400; font-size: 15px; color: var(--ink-dim); }
  .meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); margin-top: 12px; }
</style>
</head>
<body>
  <p class="lead">Turning raw spatial and ecological data into insight.</p>
  <p class="b300">Light 300 — the house body weight for leads and section intros, kept airy at 19px with a 1.55 line height.</p>
  <p class="b400">Regular 400 — used for dense UI text, list items, and meta at 15px.</p>
  <p class="meta">Barlow · 300 / 400 / 500 · 1.55 line-height</p>
</body>
</html>
