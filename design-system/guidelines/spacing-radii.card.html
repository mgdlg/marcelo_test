<!-- @dsCard group="Spacing" viewport="700x190" name="Corner radii" subtitle="From 14px chips to the 28px panel & full pills" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px 30px; display: flex; gap: 18px; align-items: flex-end; }
  .sw { text-align: center; }
  .box { width: 96px; height: 80px; background: var(--bg-1); border: 1px solid var(--rule); box-shadow: inset 0 1px 1px rgba(255,255,255,0.08); }
  .name { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--ink); margin-top: 10px; }
  .val { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); }
  .pill { width: 130px; height: 44px; border-radius: 9999px; }
</style>
</head>
<body>
  <div class="sw"><div class="box" style="border-radius:14px"></div><div class="name">radius-xs</div><div class="val">14px</div></div>
  <div class="sw"><div class="box" style="border-radius:16px"></div><div class="name">radius-sm</div><div class="val">16px</div></div>
  <div class="sw"><div class="box" style="border-radius:22px"></div><div class="name">radius-md</div><div class="val">22px</div></div>
  <div class="sw"><div class="box" style="border-radius:28px"></div><div class="name">radius</div><div class="val">28px</div></div>
  <div class="sw"><div class="box pill"></div><div class="name">radius-pill</div><div class="val">9999px</div></div>
</body>
</html>
