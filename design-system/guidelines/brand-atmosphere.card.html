<!-- @dsCard group="Brand" viewport="700x240" name="Spectral backdrop" subtitle="Breathing spectral mesh + grain film + drifting aura orbs" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { height: 100%; }
  body { margin: 0; position: relative; overflow: hidden; isolation: isolate; }
  .label { position: absolute; bottom: 22px; left: 26px; z-index: 2; }
  .t { font-family: var(--font-display); font-weight: 600; font-size: 22px; color: var(--ink); }
  .s { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); margin-top: 4px; }
</style>
</head>
<body>
  <div class="substrate"></div>
  <div class="grain"></div>
  <div class="aura">
    <span style="width:340px;height:340px;left:-4%;top:-30%;background:var(--spec-amber)"></span>
    <span style="width:280px;height:280px;right:2%;top:20%;background:var(--spec-magenta);animation-delay:-9s"></span>
    <span style="width:220px;height:220px;left:36%;bottom:-30%;background:var(--spec-azure);animation-delay:-15s"></span>
  </div>
  <div class="label">
    <div class="t">Warm dark, alive</div>
    <div class="s">substrate · grain · aura</div>
  </div>
</body>
</html>
