<!-- @dsCard group="Type" viewport="700x230" name="Display — Syne" subtitle="Geometric grotesque for headings & the hero name" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 30px 34px; display: flex; gap: 30px; align-items: center; }
  .big { font-family: var(--font-display); font-weight: 700; font-size: 120px; line-height: 0.9; letter-spacing: -0.02em; color: var(--ink); }
  .scale > div { font-family: var(--font-display); letter-spacing: -0.02em; line-height: 1.05; color: var(--ink); margin-bottom: 6px; }
  .meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); }
  .w { color: var(--ink-faint); font-size: 13px; font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="big">Aa</div>
  <div class="scale">
    <div style="font-size:46px;font-weight:700">Featured projects</div>
    <div style="font-size:30px;font-weight:600">Spatial measurement</div>
    <div style="font-size:19px;font-weight:600">Section subhead</div>
    <p class="meta" style="margin-top:14px">Syne · 600 / 700 · tracking −0.02em · clamp 22 → 168px</p>
  </div>
</body>
</html>
