<!-- @dsCard group="Type" viewport="700x210" name="Editorial — Instrument Serif" subtitle="Italic serif for pull-quotes & figures" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 32px 34px; }
  .quote { font-family: var(--font-serif); font-style: italic; font-size: 32px; line-height: 1.25; color: var(--ink); margin: 0 0 16px; max-width: 34ch; }
  .num { font-family: var(--font-serif); font-style: italic; font-size: 56px; color: var(--accent-warm); line-height: 1; }
  .row { display: flex; align-items: baseline; gap: 22px; }
  .meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); margin-top: 16px; }
</style>
</head>
<body>
  <div class="row">
    <span class="num">2.9%</span>
    <p class="quote">Three categories, eleven headline honors — measurable evidence.</p>
  </div>
  <p class="meta">Instrument Serif · italic · editorial figures &amp; statements only</p>
</body>
</html>
