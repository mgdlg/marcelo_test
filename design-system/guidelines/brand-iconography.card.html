<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 30px 34px; display: flex; gap: 38px; align-items: center; flex-wrap: wrap; }
  .g { text-align: center; }
  .mark { font-size: 26px; color: var(--accent-warm); height: 34px; display: flex; align-items: center; justify-content: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-warm); box-shadow: 0 0 10px var(--accent-warm); margin: 13px auto; }
  .dash { width: 18px; height: 1px; background: var(--accent-warm); margin: 16px auto; }
  .rule { width: 34px; height: 1px; background: linear-gradient(90deg, var(--accent-warm), transparent); margin: 16px auto; }
  .lab { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); }
</style>
</head>
<body>
  <div class="g"><div class="mark">◇</div><div class="lab">ticker diamond</div></div>
  <div class="g"><div class="mark">→</div><div class="lab">button arrow</div></div>
  <div class="g"><div class="mark">‹ ›</div><div class="lab">carousel chevrons</div></div>
  <div class="g"><div class="mark">↗</div><div class="lab">external link</div></div>
  <div class="g"><div class="dot"></div><div class="lab">meta dot</div></div>
  <div class="g"><div class="dash"></div><div class="lab">list marker</div></div>
  <div class="g"><div class="rule"></div><div class="lab">eyebrow rule</div></div>
</body>
</html>
