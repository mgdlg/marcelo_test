<!-- @dsCard group="Colors" viewport="700x190" name="Atmospheric aura hues" subtitle="Warm spectral bands behind the dark backdrop" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px 30px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 84px; border-radius: 14px; border: 1px solid var(--rule); }
  .name { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); margin-top: 10px; }
  .val { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); margin-top: 2px; }
  .note { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 14px; }
</style>
</head>
<body>
  <p class="note">Blurred 120px · screen blend · ~12% opacity · drift animation</p>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--spec-azure)"></div><div class="name">spec-azure</div><div class="val">L 0.42 · 55°</div></div>
    <div class="sw"><div class="chip" style="background:var(--spec-magenta)"></div><div class="name">spec-magenta</div><div class="val">L 0.38 · 20°</div></div>
    <div class="sw"><div class="chip" style="background:var(--spec-amber)"></div><div class="name">spec-amber</div><div class="val">L 0.60 · 62°</div></div>
  </div>
</body>
</html>
